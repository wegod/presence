# Seckill MVP — sized for a ~2C6G host
name: seckill

services:
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill
      MYSQL_USER: seckill
      MYSQL_PASSWORD: seckill
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-method=O_DIRECT
      - --max-connections=200
      - --performance-schema=OFF
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/seckill.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: seckill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kafka:
    image: apache/kafka:3.8.1
    container_name: seckill-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Heap ~256–384MB; container limited below
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: seckill-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SECKILL_STOCK_TOPIC: seckill.stock.deduct
      SECKILL_STOCK_PARTITIONS: "3"
      SECKILL_STOCK_REPLICATION: "1"
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"
    mem_limit: 256m

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: seckill-app
    restart: unless-stopped
    ports:
      - "18178:18178"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xmx3g -Xms1g -Duser.timezone=Asia/Shanghai"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: seckill
      MYSQL_PASSWORD: seckill
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:29092
      SECKILL_QPS: "500"
      PAY_WINDOW_MINUTES: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 4g
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:18178/actuator/health || curl -fsS http://127.0.0.1:18178/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: seckill-frontend
    restart: unless-stopped
    ports:
      - "18179:80"
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
